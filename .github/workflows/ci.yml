name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: humanmsg
          POSTGRES_PASSWORD: humanmsg
          POSTGRES_DB: humanmsg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U humanmsg -d humanmsg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://humanmsg:humanmsg@localhost:5432/humanmsg

    steps:
      - uses: actions/checkout@v4

      # The pnpm version is taken from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The production bundles of the web app and the back office must build
      - run: pnpm build

      # End-to-end: two browsers, a question from one reaches the other and the answer comes back
      - run: pnpm --filter @human-msg/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: apps/e2e/test-results
          if-no-files-found: ignore
