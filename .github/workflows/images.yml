name: Images

# Builds the production images in CI and publishes them to GitHub Container Registry, so a small
# server (512 MB) only pulls them: building the frontends needs about 1 GB (docs/DEPLOY.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The OAuth client id is public; it is compiled into the web bundle. Set it in
      # Settings -> Secrets and variables -> Actions -> Variables
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Name the images
        run: |
          # Registry paths must be lowercase
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::The GOOGLE_CLIENT_ID variable is not set: the web app is built without the Google sign-in button"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image (api, bot, worker, migrations)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/server:latest
            ${{ env.IMAGE_REPO }}/server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Caddy image (proxy and static files)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: caddy
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.IMAGE_REPO }}/caddy:latest
            ${{ env.IMAGE_REPO }}/caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max
