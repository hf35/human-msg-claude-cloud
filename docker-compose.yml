# Local development stack. Production uses its own compose file (see docs/TASKS.md, stage 12).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-humanmsg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-humanmsg}
      POSTGRES_DB: ${POSTGRES_DB:-humanmsg}
    ports:
      # Bound to localhost only: the database must not be reachable from outside
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
