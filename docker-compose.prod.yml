# Production stack: caddy (HTTPS, static files, proxy), server and postgres.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# On a small server (512 MB) do not build there: CI publishes the images (.github/workflows/images.yml)
# and the server only pulls them: `dc pull && dc up -d --no-build` (docs/DEPLOY.md, section 9).
# With enough memory (about 2 GB) `dc up -d --build` builds the same images locally.
#
# Settings come from .env (see .env.example, section "Production"); docs/DEPLOY.md has the full guide.
# Only caddy publishes ports. The server and the database are reachable inside the stack only.
name: human-msg

x-logging: &logging # Docker keeps container logs forever by default, which fills a small disk
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    # Defaults assume a big machine; this is enough for the app and keeps postgres small
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=128MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-humanmsg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-humanmsg}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Monthly pg_dump with rotation (docs/BACKUP.md). Dumps land in BACKUP_DIR on the host
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    command: ['/deploy/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-humanmsg}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-humanmsg}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_EVERY_DAYS: ${BACKUP_EVERY_DAYS:-30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-180}
    volumes:
      - ./deploy:/deploy:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Applies pending migrations and exits; the server starts only after it succeeds
  migrate:
    image: &server-image ${IMAGE_REPO:-ghcr.io/hf35/human-msg-claude-cloud}/server:${IMAGE_TAG:-latest}
    build: &server-build
      context: .
      target: runtime
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    mem_limit: 256m
    logging: *logging
    command: ['packages/db/node_modules/.bin/tsx', 'packages/db/src/migrate-cli.ts']
    restart: 'no'
    environment: &database
      DATABASE_URL: postgres://${POSTGRES_USER:-humanmsg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-humanmsg}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: *server-image
    build: *server-build
    restart: unless-stopped
    logging: *logging
    mem_limit: 224m
    environment:
      <<: *database
      # Garbage-collect the heap before it grows past this (the process stays near 100 MB)
      NODE_OPTIONS: --max-old-space-size=128
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_ID: ${SERVER_ID:-server-1}
      # The server is reachable through caddy only, so X-Forwarded-For can be trusted
      TRUST_PROXY: 'true'
      DEV_LOGIN: 'false'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      BACKOFFICE_LOGIN: ${BACKOFFICE_LOGIN:-}
      BACKOFFICE_PASSWORD_HASH: ${BACKOFFICE_PASSWORD_HASH:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: ${IMAGE_REPO:-ghcr.io/hf35/human-msg-claude-cloud}/caddy:${IMAGE_TAG:-latest}
    logging: *logging
    mem_limit: 96m
    build:
      context: .
      target: caddy
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2-alpine}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # Certificates and ACME account: losing them means re-issuing and hitting rate limits
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
